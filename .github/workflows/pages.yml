name: Deploy live demo to GitHub Pages

# Publishes the static front-end in hijrical_studio/web as a GitHub Pages site.
# No build step: the page loads Pyodide and micropip-installs `hijrical` at
# runtime, so the whole studio runs client-side.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: hijrical_studio/web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
